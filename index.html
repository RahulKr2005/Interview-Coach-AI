<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=frontend/dist/index.html" />
    <title>InterviewCoach AI - Placement Prep</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px;
        max-width: 480px;
        margin: 20px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px 0;
        color: #2dd4bf;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      a.btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #0d9488;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 8px;
        transition: background-color 0.2s;
      }
      a.btn:hover {
        background-color: #14b8a6;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #334155;
        border-top-color: #2dd4bf;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Immediately forward to built frontend for VS Code Live Server
      window.location.replace("./frontend/dist/index.html");
    </script>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Launching InterviewCoach AI</h1>
      <p>Redirecting to the placement prep application...</p>
      <a class="btn" href="./frontend/dist/index.html">Open InterviewCoach AI</a>
    </div>
  </body>
</html>
